name: Set up NYTFT Python environment
description: Install Python 3.11 and the shared crawl/verification dependencies (run after actions/checkout).

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml urllib3
