name: New Yorker Tables for Two final verification

on:
  push:
    paths:
      - scripts/prepare_final_candidates.py
      - scripts/nytft_final_verify.py
      - payload/repair_v6.py.gz.b64
      - .github/workflows/nytft_final_verify.yml
      - .github/actions/setup-nytft/action.yml
  pull_request:
    paths:
      - audit-triggers/nytft-final-verify-*.txt
      - scripts/prepare_final_candidates.py
      - scripts/nytft_final_verify.py
      - payload/repair_v6.py.gz.b64
      - .github/workflows/nytft_final_verify.yml
      - .github/actions/setup-nytft/action.yml
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Run ID of a successful "New Yorker Tables for Two full audit" run (default: latest successful)
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nytft

      - name: Download exhaustive crawl artifact
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional explicit run ID; otherwise the latest successful full-audit run is used.
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
        run: |
          run_id="$UPSTREAM_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow nytft-full-audit.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful 'New Yorker Tables for Two full audit' run found; run that workflow (branch nytft-full-audit-20260807) first. Artifacts expire after 7 days."
            exit 1
          fi
          echo "Using full-audit run $run_id"
          mkdir -p upstream_artifact
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name newyorker-tables-for-two-full-audit \
            --dir upstream_artifact
          find upstream_artifact -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | head -80

      - name: Decode and validate source-repair tool
        run: |
          set -o pipefail
          mkdir -p work
          if ! base64 -d payload/repair_v6.py.gz.b64 | gzip -dc > work/repair_v6.py; then
            echo "::error file=payload/repair_v6.py.gz.b64::repair_v6 payload does not decode cleanly; re-encode it from a known-good repair_v6.py"
            exit 1
          fi
          python -m py_compile work/repair_v6.py scripts/prepare_final_candidates.py scripts/nytft_final_verify.py
          sha256sum work/repair_v6.py scripts/prepare_final_candidates.py scripts/nytft_final_verify.py

      - name: Prepare source-corrected candidates
        env:
          NYTFT_WORK_ROOT: ${{ github.workspace }}/work
          NYTFT_EXHAUSTIVE_ROOT: ${{ github.workspace }}/upstream_artifact
        run: |
          python scripts/prepare_final_candidates.py | tee work/prepare_candidates.log
          gzip -9 -n -c work/final_candidates_input.csv | base64 -w0 > work/final_candidates_input.csv.gz.b64
          python - <<'PY'
          import csv
          for path in ['work/final_candidates_input.csv','work/final_candidate_evidence.csv']:
              with open(path,encoding='utf-8-sig',newline='') as f:
                  print(path, sum(1 for _ in csv.DictReader(f)))
          PY

      - name: Run final constrained verification
        id: verifier
        continue-on-error: true
        env:
          UPSTREAM_ROOT: ${{ github.workspace }}/upstream_artifact
          INPUT_B64: ${{ github.workspace }}/work/final_candidates_input.csv.gz.b64
          OUTPUT_DIR: ${{ github.workspace }}/nytft_final_verification
          MAX_GEOCODES: '0'
        run: |
          python scripts/nytft_final_verify.py | tee work/final_verification.log

      - name: Inspect final verification output
        if: always()
        run: |
          find nytft_final_verification work -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          test -f nytft_final_verification/final_verification_summary.json && cat nytft_final_verification/final_verification_summary.json || true

      - name: Upload final verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newyorker-tables-for-two-final-verification
          path: |
            nytft_final_verification/**
            work/final_candidates_input.csv
            work/final_candidate_evidence.csv
            work/prepare_candidates.log
            work/final_verification.log
            work/repair_v6.py
            scripts/prepare_final_candidates.py
            scripts/nytft_final_verify.py
          if-no-files-found: error
          retention-days: 7

      - name: Propagate verifier failure after preserving evidence
        if: steps.verifier.outcome == 'failure'
        run: exit 1
