name: New Yorker Tables for Two recovery audit

on:
  pull_request:
    paths:
      - 'recovery_payload/**'
      - '.github/workflows/nytft-recovery.yml'
      - 'audit-triggers/nytft-recovery-20260807.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml urllib3

      - name: Reconstruct and compile recovery program
        run: |
          mkdir -p scripts
          cat recovery_payload/nytft_recover.py.gz.b64.part00 \
              recovery_payload/nytft_recover.py.gz.b64.part01 \
              recovery_payload/nytft_recover.py.gz.b64.part02 \
            | base64 --decode | gzip --decompress > scripts/nytft_recover.py
          python -m py_compile scripts/nytft_recover.py
          sha256sum scripts/nytft_recover.py | tee recovery-script.sha256

      - name: Download complete source-occurrence audit artifact
        uses: actions/download-artifact@v4
        with:
          name: newyorker_tables_for_two_full_audit_raw
          path: input_artifact
          github-token: ${{ github.token }}
          repository: arthurfouray/af
          run-id: 31205115342

      - name: Recover, re-verify, and rebuild public outputs
        id: recover
        env:
          INPUT_ROOT: ${{ github.workspace }}/input_artifact
          OUTPUT_DIR: ${{ github.workspace }}/recovered_output
          GOOGLE_DELAY: '0.25'
          GEOCODER_DELAY: '0.15'
          RECOVERY_WORKERS: '6'
          REQUEST_TIMEOUT: '25'
          MAX_RETRIES: '4'
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -u scripts/nytft_recover.py 2>&1 | tee recovery.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Recovery process exit code: $code"
          exit 0

      - name: Inspect recovery package
        if: always()
        run: |
          echo "Recovery exit code: ${{ steps.recover.outputs.exit_code }}"
          find recovered_output -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort || true
          cat recovered_output/run_summary.json || true
          ls -lh newyorker_tables_for_two_recovered_audit.zip || true

      - name: Upload recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newyorker_tables_for_two_recovered_audit
          path: |
            recovered_output/**
            newyorker_tables_for_two_recovered_audit.zip
            recovery.log
            recovery-script.sha256
            scripts/nytft_recover.py
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Propagate validation failure after preserving evidence
        if: always()
        run: test "${{ steps.recover.outputs.exit_code }}" = "0"
