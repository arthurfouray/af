name: Arthur Fouray Systems residual performance QA

on:
  push:
    paths:
      - scripts/afs-residual/**
      - .github/workflows/afs_residual_qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install browser driver
        working-directory: scripts/afs-residual
        run: npm install --no-audit --no-fund --no-save playwright-core@1.55.0
      - name: Run matched public A/B
        working-directory: scripts/afs-residual
        env:
          AFS_QA_MATRIX: paint-control
          AFS_QA_PAINT_DIAGNOSTIC: '0'
        run: node single-cap-qa.mjs "$GITHUB_WORKSPACE/afs-residual-qa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afs-residual-qa
          path: ${{ github.workspace }}/afs-residual-qa
          retention-days: 30
