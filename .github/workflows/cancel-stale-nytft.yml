name: Cancel stale NYTFT audit runs

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel-stale:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/cancel-stale-nytft')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded Tables for Two audits
        uses: actions/github-script@v7
        with:
          script: |
            const preferredRun = 31206158007;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nytft-full-audit.yml',
                branch: 'nytft-full-audit-20260807',
                event: 'pull_request',
                per_page: 100,
              }
            );
            const stale = runs.filter(run =>
              run.id !== preferredRun &&
              (run.status === 'queued' || run.status === 'in_progress')
            );
            core.info(`Cancelling ${stale.length} superseded audit runs; preserving ${preferredRun}.`);
            for (const run of stale) {
              core.info(`Cancelling run ${run.id} (#${run.run_number}, ${run.status}).`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }
